<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Whales</title>
    <meta
      name="description"
      content="1000 pixel whales. Every fee in the ocean flows to them."
    />
    <!-- The tab icon is a real whale from the collection, #0943: the crowned
         one with the cigar and the cuban chain, lifted off its flat background
         and put back in the water. Raster rather than the old SVG, because it
         is the collection's own pixels rather than a drawing of them. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#04182b" />
    <!-- The headline is the first thing painted; it should never swap faces. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/anton-latin-400-normal.woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
